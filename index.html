
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo de Adivinhação</title>
<p>Desafie sua sorte e descubra o número secreto!</p>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <h1>🎯 Adivinhe o Número!</h1>

        <p>
            Escolhi um número entre 1 e 100.
            Será que você consegue descobrir?
        </p>

        <input
            type="number"
            id="palpite"
            min="1"
            max="100"
            placeholder="Digite seu palpite"
        >

        <button id="btnTentar">Tentar</button>

        <p id="mensagem">Boa sorte!</p>

        <p id="tentativas">Tentativas: 0</p>

        <button id="btnReiniciar">Novo jogo</button>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
